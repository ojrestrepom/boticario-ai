[workspace]
members = ["catalog-core", "catalog-ingest", "catalog-api"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
unicode-normalization = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
csv = "1"
encoding_rs = "0.8"
md-5 = "0.11"
tempfile = "3"
toml = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
